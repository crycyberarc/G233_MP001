data:
  train: data/raw/train.csv
  later: data/raw/later.csv
  holdout: data/raw/holdout_features.csv
  findings: reports/findings.yaml
training:
  validation_fraction: 0.20
  seed: 233
  experiment: G233 MP001 v1
  artifact_location: models/mlflow
  registered_model: G233-MP001-bus-delay
  export: models/model.joblib
  candidates:
    - name: ridge
      alpha: 1.0
    - name: random_forest
      n_estimators: 250
      min_samples_leaf: 5
    - name: histogram_gradient_boosting
      max_iter: 200
      max_leaf_nodes: 15
      l2_regularization: 1.0
