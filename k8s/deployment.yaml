apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp001-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mp001-api
  template:
    metadata:
      labels:
        app: mp001-api
    spec:
      containers:
        - name: api
          image: mp001-api:1.0
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
